server:
  port: 8083
  shutdown: graceful

spring:
  mvc:
    problemdetails:
      enabled: true
  application:
    name: trust-service
  profiles:
    default: local
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  rabbitmq:
    host: ${RABBIT_HOST}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER}
    password: ${RABBIT_PASSWORD}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2

trust:
  messaging:
    exchange: ${EVENTS_EXCHANGE:peaceapp.events}
  outbox:
    poll-interval-ms: ${OUTBOX_POLL_MS:1000}
  duplicate:
    radius-meters: ${DUPLICATE_RADIUS_METERS:100}
    window-minutes: ${DUPLICATE_WINDOW_MINUTES:30}
  moderation:
    falseness-threshold: ${FALSENESS_THRESHOLD:0.6}
  appeal:
    window-days: ${APPEAL_WINDOW_DAYS:7}

management:
  metrics:
    tags:
      application: ${spring.application.name}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p [%X{requestId:-},%X{userId:-}]"
