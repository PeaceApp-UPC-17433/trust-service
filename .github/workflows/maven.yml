name: trust-service CI and delivery

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trust-service-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Tests and application coverage gate
        run: mvn -B -ntp clean verify
      - name: Build and start with PostgreSQL
        run: docker compose -p ci up --build --wait --wait-timeout 180 -d
      - name: Verify non-root runtime and HTTP health
        run: |
          test "$(docker compose -p ci exec -T trust-service id -u)" = 100
          curl --fail --silent http://localhost:8083/actuator/health | tee health.json
          python3 -c 'import json; assert json.load(open("health.json"))["status"] == "UP"'
      - name: Collect sanitized container logs
        if: always()
        run: |
          docker compose -p ci ps -a > containers.txt
          docker compose -p ci logs --no-color 2>&1 | sed -E 's/(Using generated security password:).*/\1 [REDACTED]/' > containers.log
      - name: Preserve reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trust-service-verification
          path: |
            target/surefire-reports/
            target/site/jacoco/
            health.json
            containers.txt
            containers.log
          retention-days: 30
          if-no-files-found: error
      - name: Stop test containers
        if: always()
        run: docker compose -p ci down --volumes

  publish:
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Sign in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Publish verified revision
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker build --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" --label "org.opencontainers.image.revision=$GITHUB_SHA" -t "$image:$GITHUB_SHA" -t "$image:$GITHUB_REF_NAME" .
          docker push "$image:$GITHUB_SHA"
          docker push "$image:$GITHUB_REF_NAME"
