name: trust-service CI and delivery

on:
  push:
    branches: [main, develop]
    tags: ['v*.*.*']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trust-service-${{ github.ref }}
  cancel-in-progress: true

env:
  SERVICE: trust-service
  PORT: 8083

jobs:
  verify:
    name: Build, tests y coverage gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.semver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Unit, Cucumber (Testcontainers) y JaCoCo check >= 70 %
        run: mvn -B -ntp clean verify
      - name: Calcular version semantica
        id: semver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            base=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version | sed 's/-SNAPSHOT//')
            version="${base}-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"
      - name: Preservar reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trust-service-verification
          path: |
            target/surefire-reports/
            target/site/jacoco/
            target/cucumber-reports/
          retention-days: 30
          if-no-files-found: error

  quality:
    name: SonarCloud Quality Gate
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Verificar configuracion de SonarCloud
        if: env.SONAR_TOKEN == ''
        run: echo "::warning::SONAR_TOKEN no esta configurado en el repositorio; se omite el analisis de SonarCloud."
      - uses: actions/checkout@v4
        if: env.SONAR_TOKEN != ''
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        if: env.SONAR_TOKEN != ''
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Analisis y espera del Quality Gate
        if: env.SONAR_TOKEN != ''
        run: >
          mvn -B -ntp verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.organization=peaceapp-upc-17433
          -Dsonar.projectKey=PeaceApp-UPC-17433_trust-service
          -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
          -Dsonar.qualitygate.wait=true

  container:
    name: Contenedor no root y health check
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build y arranque con PostgreSQL
        run: docker compose -p ci up --build --wait --wait-timeout 180 -d
      - name: Verificar usuario no root y /actuator/health
        run: |
          test "$(docker compose -p ci exec -T $SERVICE id -u)" = 100
          curl --fail --silent http://localhost:$PORT/actuator/health | tee health.json
          python3 -c 'import json; assert json.load(open("health.json"))["status"] == "UP"'
      - name: Logs saneados
        if: always()
        run: |
          docker compose -p ci ps -a > containers.txt
          docker compose -p ci logs --no-color 2>&1 | sed -E 's/(Using generated security password:).*/\1 [REDACTED]/' > containers.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trust-service-container
          path: |
            health.json
            containers.txt
            containers.log
          retention-days: 30
      - name: Detener contenedores
        if: always()
        run: docker compose -p ci down --volumes

  publish:
    name: Publicar imagen en GHCR (SemVer)
    needs: [verify, quality, container]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Login en GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build y push con etiquetas SemVer
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          short_sha="${GITHUB_SHA::7}"
          tags=(-t "$image:$VERSION" -t "$image:sha-$short_sha")
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tags+=(-t "$image:${VERSION%.*}" -t "$image:latest")
          fi
          docker build \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=$VERSION" \
            "${tags[@]}" .
          docker push --all-tags "$image"

  deploy:
    name: Despliegue en AKS
    needs: [verify, publish]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/aks-set-context@v4
        with:
          resource-group: rg-peaceapp
          cluster-name: aks-peaceapp
      - name: Actualizar imagen y esperar el rollout
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:$VERSION"
          kubectl -n peaceapp set image deployment/$SERVICE $SERVICE="$image"
          kubectl -n peaceapp rollout status deployment/$SERVICE --timeout=180s
      - name: Smoke test
        run: |
          ip=$(kubectl -n peaceapp get svc $SERVICE -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          curl --fail --retry 5 --retry-delay 10 "http://$ip/actuator/health"
